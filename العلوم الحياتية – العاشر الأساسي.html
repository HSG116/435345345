<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>العلوم الحياتية – العاشر الأساسي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7faf9;--card:#fff;--ink:#1c2b33;--mut:#5c6f78;--line:#dce7e4;--ac:#0f766e;--acs:#e3f4f1;--ok:#15803d;--oks:#e6f6ec;--bad:#b91c1c;--bads:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#f7faf9;--card:#fff;--ink:#1c2b33}}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.9 "IBM Plex Sans Arabic",Tahoma,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{max-width:1000px;margin:auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{font-weight:700;font-size:18px;color:var(--ac);margin-inline-end:auto}
nav{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav a{padding:6px 14px;border-radius:8px;color:var(--mut);text-decoration:none;white-space:nowrap;font-size:15px;font-weight:500}
nav a.on{background:var(--acs);color:var(--ac)}
main{max-width:1000px;margin:auto;padding:28px 16px 60px}
h1{font-size:34px;line-height:1.4;margin:0 0 8px}
h2{font-size:24px;margin:34px 0 12px;padding-inline-start:12px;border-inline-start:4px solid var(--ac)}
h3{font-size:18px;margin:0 0 4px;color:var(--ac)}
p{margin:6px 0;max-width:70ch}
.lead{color:var(--mut);font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card p{font-size:15.5px;line-height:1.8;color:#34464f}
a.card{text-decoration:none;color:inherit;display:block}
a.card:hover{border-color:var(--ac)}
.tag{display:inline-block;font-size:13px;background:var(--acs);color:var(--ac);border-radius:6px;padding:0 8px;margin-bottom:4px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:15.5px}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line)}
th{background:var(--acs);color:var(--ac)}
tr:last-child td{border:0}
.note{background:#fff8e6;border:1px solid #f0dca0;border-radius:12px;padding:12px 16px;margin:12px 0;font-size:15.5px}
input[type=search]{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:8px 0 16px;background:#fff}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 22px;font-weight:500}
.btn.alt{background:#fff;color:var(--ac);border:1px solid var(--ac)}
.opt{display:block;width:100%;text-align:right;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.ok{background:var(--oks);border-color:var(--ok);color:var(--ok)}
.opt.no{background:var(--bads);border-color:var(--bad);color:var(--bad)}
.prog{height:6px;background:var(--line);border-radius:3px;margin:12px 0}
.prog i{display:block;height:100%;background:var(--ac);border-radius:3px;transition:width .3s}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.score{font-size:46px;font-weight:700;color:var(--ac)}
details{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin:8px 0}
summary{cursor:pointer;font-weight:500}
details p{color:#34464f;font-size:15.5px}
:focus-visible{outline:3px solid #5eead4;outline-offset:2px}
@media(max-width:600px){h1{font-size:26px}body{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const PAGES={
home:["الرئيسية",()=>`
<h1>العلوم الحياتية للصف العاشر</h1>
<p class="lead">الخلية: تركيب ووظائف الأجزاء، والمادة الوراثية. ملخص منظم، مصطلحات، تعليلات، ومراجعة تفاعلية من ${QC.length+QG.length} سؤالاً.</p>
<h2>ابدأ من هنا</h2>
<div class="grid">
<a class="card" href="#cell"><h3>الخلية والعضيات</h3><p>نظرية الخلية، أنواع الخلايا، ${ORG.length} عضية، ومقارنة النباتية بالحيوانية.</p></a>
<a class="card" href="#dna"><h3>المادة الوراثية</h3><p>DNA وRNA والتضاعف ومسائل النسب.</p></a>
<a class="card" href="#terms"><h3>المصطلحات</h3><p>${TERMS.length} مصطلحاً علمياً مع بحث سريع.</p></a>
<a class="card" href="#why"><h3>علّل</h3><p>${WHY.length} تعليلاً. اضغط لتظهر الإجابة.</p></a>
<a class="card" href="#quiz"><h3>اختبر نفسك</h3><p>أسئلة اختيار من متعدد مع تصحيح فوري ونتيجة.</p></a>
<a class="card" href="#review"><h3>مراجعة نهائية</h3><p>أزواج الحفظ وأهم التنبيهات العلمية.</p></a>
</div>`],

cell:["الخلية",()=>`
<h1>الخلية: التركيب والوظائف</h1>
<h2>نظرية الخلية</h2>
<div class="card"><p>١. جميع الكائنات الحية تتكون من خلية واحدة أو أكثر.<br>٢. الخلية وحدة البناء والتركيب والوظيفة.<br>٣. تنتج الخلايا الجديدة من خلايا سابقة لها.</p></div>
<h2>بدائية النوى وحقيقية النوى</h2>
${T(["وجه المقارنة","بدائية النوى","حقيقية النوى"],[["الحجم","1–5 ميكرومتر","10–100 ميكرومتر"],["النواة","لا توجد نواة حقيقية","نواة بغلاف نووي"],["الكروموسوم","غالباً دائري واحد","عدة كروموسومات خطية"],["الهستونات","لا توجد","توجد"],["العضيات الغشائية","لا توجد","توجد"],["أمثلة","البكتيريا","النبات والحيوان والفطريات"]])}
<h2>المكونات الأساسية الثلاثة</h2>
<div class="grid">
<div class="card"><h3>الغشاء الخلوي</h3><p>مزدوج الطبقة من دهون فسفورية تتخللها بروتينات. يفصل الخلية عن الوسط وينظم دخول المواد وخروجها (نفاذية اختيارية).</p></div>
<div class="card"><h3>السيتوبلازم</h3><p>المنطقة بين الغشاء والنواة: السيتوسول (محلول غروي) والعضيات.</p></div>
<div class="card"><h3>النواة</h3><p>غلاف نووي، سائل نووي، ونوية. تمثل مركز التحكم بالأنشطة الحيوية.</p></div></div>
<h2>العضيات ووظائفها</h2>
<div class="grid">${ORG.map(o=>`<div class="card"><h3>${o[0]}</h3><p>${o[1]}</p></div>`).join('')}</div>
<h2>النباتية والحيوانية</h2>
${T(["وجه المقارنة","النباتية","الحيوانية"],[["الجدار الخلوي","يوجد","لا يوجد"],["البلاستيدات","توجد","لا توجد"],["الفجوات","كبيرة غالباً","صغيرة كثيرة"],["المريكزات","غير موجودة عادة","توجد"],["الميتوكندريا والغشاء والنواة","توجد","توجد"]])}
<h2>الشبكة الخشنة والملساء</h2>
${T(["وجه المقارنة","الخشنة","الملساء"],[["الرايبوسومات","على سطحها","لا توجد"],["الوظيفة","بناء البروتينات ونقلها وتغليفها","تصنيع الليبيدات"]])}`],

dna:["المادة الوراثية",()=>`
<h1>المادة الوراثية</h1>
<div class="grid">
<div class="card"><h3>الكروموسوم</h3><p>DNA وبروتينات (الهستونات في حقيقية النوى).</p></div>
<div class="card"><h3>الجين</h3><p>جزء من DNA مسؤول عن صفة معينة.</p></div>
<div class="card"><h3>النيوكليوتيد</h3><p>سكر خماسي + مجموعة فوسفات + قاعدة نيتروجينية. القاعدة ترتبط بالكربون 1، والفوسفات بالكربون 5.</p></div></div>
<h2>DNA وRNA</h2>
${T(["وجه المقارنة","DNA","RNA"],[["السلاسل","سلسلتان","سلسلة واحدة"],["السكر","ريبوز منقوص الأكسجين","ريبوز"],["القواعد","A, T, G, C","A, U, G, C"],["الوظيفة","حفظ المعلومات الوراثية ونقلها","التعبير الجيني وصنع البروتين"]])}
<h2>أنواع RNA</h2>
<div class="grid"><div class="card"><h3>mRNA</h3><p>ينقل الشفرة من DNA إلى الرايبوسوم.</p></div><div class="card"><h3>tRNA</h3><p>ينقل الأحماض الأمينية إلى الرايبوسوم.</p></div><div class="card"><h3>rRNA</h3><p>يدخل في تركيب الرايبوسومات.</p></div></div>
<h2>تضاعف DNA</h2>
<div class="card"><p>يحدث في مرحلة S. <b>الهيليكاز</b> يفك الروابط الهيدروجينية ويفصل السلسلتين، وكل سلسلة قالب. <b>DNA بوليميراز</b> يضيف النيوكليوتيدات المكملة، و<b>الليجيز</b> يربط القطع. الناتج جزيئان في كل منهما سلسلة قديمة وجديدة، لذا التضاعف <b>شبه محافظ</b>.</p></div>
<h2>مسائل النسب</h2>
<div class="note">في DNA: A = T وG = C، ومجموع النسب 100%.<br>مثال: G = 20% ⇐ C = 20% والباقي 60% ⇐ A = 30%.<br>مثال: 800 قاعدة والثايمين 250 ⇐ A = 250، وG + C = 300 ⇐ السايتوسين 150.</div>
<p><b>روابط:</b> بين A وT رابطتان هيدروجينيتان، وبين G وC ثلاث.</p>`],

terms:["المصطلحات",()=>`<h1>المصطلحات العلمية</h1><input type="search" id="q" placeholder="ابحث عن مصطلح أو كلمة من التعريف"><div id="tl"></div>`,()=>{
 const r=()=>{const v=$('#q').value.trim();$('#tl').innerHTML=TERMS.filter(t=>!v||(t[0]+t[1]).includes(v)).map(t=>`<details><summary>${t[0]}</summary><p>${t[1]}</p></details>`).join('')||'<p>لا نتائج. جرّب كلمة أقصر.</p>'};
 $('#q').oninput=r;r()}],

why:["علّل",()=>`<h1>علّل</h1><p class="lead">فكّر في الجواب أولاً ثم افتح التعليل.</p>${WHY.map((w,i)=>`<details><summary>${i+1}. ${w[0]}</summary><p>${w[1]}</p></details>`).join('')}`],

review:["مراجعة",()=>`<h1>مراجعة نهائية</h1><h2>أزواج الحفظ</h2>${T(["السؤال أو الوظيفة","الإجابة"],PAIRS)}
<h2>تنبيهات علمية</h2>
<div class="note">لا تخلط بين الأجسام الحالّة (هضم) والبيروكسيسومات (أكسدة).</div>
<div class="note">المريكزات 9+0، والأهداب والأسواط 9+2.</div>
<div class="note">الكلوروفيل في أغشية الثايلاكويدات وليس في الستروما.</div>
<div class="note">tRNA ينقل الأحماض الأمينية، وmRNA ينقل الشفرة، وrRNA في الرايبوسوم.</div>`],

quiz:["اختبار",()=>`<h1>اختبر نفسك</h1><div id="qz"></div>`,()=>{
 const el=$('#qz');
 const menu=()=>{el.innerHTML=`<p class="lead">اختر الوحدة.</p><div class="row"><button class="btn" data-s="c">أسئلة الخلية (${QC.length})</button><button class="btn" data-s="g">أسئلة المادة الوراثية (${QG.length})</button><button class="btn alt" data-s="a">الكل مختلط (${QC.length+QG.length})</button></div>`;
  el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>start(b.dataset.s))};
 const start=s=>{let L=s=='c'?QC:s=='g'?QG:[...QC,...QG];L=[...L].sort(()=>Math.random()-.5);let i=0,sc=0;
  const show=()=>{if(i>=L.length){el.innerHTML=`<div class="card"><div class="score">${sc} / ${L.length}</div><p>${sc/L.length>=.8?'ممتاز، مستواك قوي.':sc/L.length>=.5?'جيد، راجع الأسئلة التي أخطأت فيها.':'تحتاج مراجعة؛ ابدأ بصفحتي الخلية والمادة الوراثية.'}</p><div class="row"><button class="btn" id="r">أعد الاختبار</button><button class="btn alt" id="m">القائمة</button></div></div>`;$('#r').onclick=()=>start(s);$('#m').onclick=menu;return}
   const q=L[i];el.innerHTML=`<div class="prog"><i style="width:${i/L.length*100}%"></i></div><p>سؤال ${i+1} من ${L.length}</p><div class="card"><b>${q[0]}</b>${q[1].map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}<div class="row"><button class="btn" id="nx" hidden>${i+1==L.length?'النتيجة':'التالي'}</button></div></div>`;
   el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(k==q[2])sc++;el.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j==q[2])x.classList.add('ok');else if(j==k)x.classList.add('no')});$('#nx').hidden=false;$('#nx').focus()});
   $('#nx').onclick=()=>{i++;show()}};
  show()};
 menu()}]
};

const keys=Object.keys(PAGES);
$('#nav').innerHTML=keys.map(k=>`<a href="#${k}" data-k="${k}">${PAGES[k][0]}</a>`).join('');
function route(){let k=location.hash.slice(1);if(!PAGES[k])k='home';const p=PAGES[k];$('#app').innerHTML=p[1]();if(p[2])p[2]();document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.k==k));window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
